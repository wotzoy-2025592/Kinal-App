<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Kinal App</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="header-content">
        <div class="header-section">
            <div class="logo-kinal-app">
                <img class="logo-kinal-img" th:src="@{/img/Kinal-logo.png}">
            </div>
            <span class="title-app">Menú Kinal App</span>
        </div>
    </header>

    <main class="main-content">
        <div class="main-options">
            <a th:href="@{/main/usuarios}" class="option-container">
                <img class="option-img" th:src="@{/img/Usuarios-SinFondo.png}">
                <p class="option-text">Usuarios</p>
            </a>

            <a th:href="@{/main/productos}" class="option-container">
                <img class="option-img" th:src="@{/img/Productos-SinFondo.png}">
                <p class="option-text">Productos</p>
            </a>

            <a th:href="@{/main/usuario/user-form}" class="option-container">
                <img class="option-img" th:src="@{/img/Clientes-SinFondo.png}">
                <p class="option-text">Cliente</p>
            </a>

            <a th:href="@{/main/ventas}" class="option-container">
                <img class="option-img" th:src="@{/img/Ventas-SinFondo.png}">
                <p class="option-text">Ventas</p>
            </a>

            <a th:href="@{/main/detalle-venta}" class="option-container">
                <img class="option-img" th:src="@{/img/DetalleVenta-SinFondo.png}">
                <p class="option-text">Detalle de Venta</p>
            </a>
        </div>
    </main>
</body>
</html>
