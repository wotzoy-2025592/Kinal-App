<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Clientes</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="header-content">
        <div class="header-section">
            <div class="header-tools">
                <a th:href="@{/}" class="logo-kinal-app">
                    <img class="logo-kinal-img" th:src="@{/img/Kinal-logo.png}" alt="Logo Kinal">
                </a>

                <a th:href="@{/}" class="home-link">
                    <img class="home-img" th:src="@{/img/Home.png}" alt="Home">
                </a>
            </div>
            <span class="title-app">Fomulario de Clientes</span>
        </div>
    </header>

    <div class="form-container">
        <div class="form-card">

            <h2 class="form-title"
                th:text="${cliente.DPICliente == null} ? 'Nuevo Cliente' : 'Editar Cliente'">
            </h2>

            <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">

                <div class="form-group">
                    <label class="form-label">DPI del Cliente</label>
                    <input type="text" class="form-input" th:field="*{DPICliente}"
                           maxlength="13" oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                           th:readonly="${cliente.DPICliente != null}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-input" th:field="*{nombreCliente}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Apellido</label>
                    <input type="text" class="form-input" th:field="*{apellidoCliente}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Dirección</label>
                    <input type="text" class="form-input" th:field="*{direccion}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Estado</label>
                    <select class="form-select" th:field="*{estado}">
                        <option value="" disabled selected>Seleccione un rol</option>
                        <option value="1">Activo</option>
                        <option value="0">Inactivo</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save">Guardar Cliente</button>
                    <a th:href="@{/clientes}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
