<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tabla Detalle Venta</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="header-content">
        <div class="header-section">
            <div class="header-tools">
                <a th:href="@{/}" class="logo-kinal-app">
                    <img class="logo-kinal-img" th:src="@{/img/Kinal-logo.png}">
                </a>

                <a th:href="@{/}" class="home-link">
                    <img class="home-img" th:src="@{/img/Home.png}">
                </a>
            </div>
            <span class="title-app">Gestión de Clientes</span>
        </div>
    </header>

    <main class="main-content">
        <div class="table-container">
            <div class="table-header">
                <span class="table-title">Detalle de Ventas</span>

                <a th:href="@{/detalle-ventas/nuevo}" class="btn-add">
                    + Nuevo Detalle
                </a>
            </div>

            <form th:action="@{/detalle-ventas}" method="get" class="search-container">
                <input class="search-input" type="number" name="q"
                       placeholder="Buscar por código..." th:value="${param.q}">
                <button class="search-button" type="submit">Buscar</button>

                <a th:href="@{/detalle-ventas}" class="btn-clear">Limpiar</a>
            </form>

            <table class="custom-table">
                <thead class="table-head">
                <tr>
                    <th class="table-cell">Código</th>
                    <th class="table-cell">Cantidad</th>
                    <th class="table-cell">Precio</th>
                    <th class="table-cell">Subtotal</th>
                    <th class="table-cell">Producto</th>
                    <th class="table-cell">Venta</th>
                    <th class="table-cell">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr class="table-row" th:each="d : ${detalleVenta}">
                    <td class="table-cell" th:text="${d.codigoDetalleVenta}"></td>
                    <td class="table-cell" th:text="${d.cantidad}"></td>
                    <td class="table-cell" th:text="'Q' + ${d.precioUnitario}"></td>
                    <td class="table-cell" th:text="'Q' + ${d.subTotal}"></td>
                    <td class="table-cell" th:text="${d.productoDetalleVenta?.codigoProducto}"></td>
                    <td class="table-cell" th:text="${d.ventaDetalle?.codigoVenta}"></td>

                    <td class="table-cell">
                        <div th:if="${rolActual == 'ADMIN'}">
                            <a th:href="@{/detalle-ventas/editar/{codigo}(codigo=${d.codigoDetalleVenta})}"
                               class="btn-action btn-edit">Editar</a>

                            <a th:href="@{/detalle-ventas/eliminar/{codigo}(codigo=${d.codigoDetalleVenta})}"
                               class="btn-action btn-delete"
                               onclick="return confirm('¿Desea eliminar este detalle?')">Eliminar</a>
                        </div>

                        <div th:if="${rolActual != 'ADMIN'}">
                            <span class="btn-action btn-disabled">Editar</span>
                            <span class="btn-action btn-disabled">Eliminar</span>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(detalleVenta)}">
                    <td class="table-cell" colspan="7">No se encontraron registros</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
