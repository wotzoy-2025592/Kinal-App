<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header class="header-content">
    <div class="header-section">
        <div class="header-tools">
            <a class="logo-kinal-app">
                <img class="logo-kinal-img" th:src="@{/img/Kinal-logo.png}">
            </a>
        </div>
        <span class="title-app">Registro de Usuario</span>
    </div>
</header>

<div class="form-container">
    <div class="form-card">

        <h2 class="form-title">Crear cuenta</h2>

        <form th:action="@{/registro/añadir}" th:object="${usuario}" method="post">

            <input type="hidden" th:field="*{codigoUsuario}">

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" th:field="*{userName}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-input" th:field="*{password}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" th:field="*{email}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Rol</label>
                <select class="form-select" th:field="*{rol}">
                    <option value="USER">Usuario</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Estado</label>
                <select class="form-select" th:field="*{estado}">
                    <option value="1">Activo</option>
                    <option value="0">Inactivo</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">Guardar</button>
                <a th:href="@{/login}" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
